name-template: "$RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"
change-template: "- #$NUMBER - $TITLE (@$AUTHOR)"
sort-direction: ascending
categories:
  - title: "⚠ Breaking Changes"
    semver-increment: "major"
    when:
      label: "breaking-change"

  - title: "✨ New Features"
    semver-increment: "minor"
    when:
      labels:
        - "enhancement"
        - "feature"

  - title: "🐛 Bug Fixes"
    semver-increment: "patch"
    when:
      labels:
        - "fix"
        - "bugfix"
        - "bug"

  - title: "⚡ Performance"
    semver-increment: "patch"
    when:
      label: "performance"

  - title: "🔧 Maintenance"
    collapse-after: 3
    semver-increment: "patch"
    when:
      labels:
        - "chore"
        - "documentation"
        - "maintenance"
        - "repo"
        - "dependencies"
        - "github_actions"
        - "refactor"
        - "style"
        - "build"
        - "revert"

  - title: "🎓 Code Quality"
    collapse-after: 3
    semver-increment: "patch"
    when:
      labels:
        - "code-quality"
        - "CI"
        - "test"

  - type: "version-resolver"
    semver-increment: "patch" # Default fallback

autolabeler:
  - label: "breaking-change"
    title:
      - '/^[a-z]+(\([^)]+\))?!:/i'
  - label: "feature"
    title:
      - '/^feat(\([^)]+\))?:/i'
  - label: "bugfix"
    title:
      - '/^fix(\([^)]+\))?:/i'
  - label: "refactor"
    title:
      - '/^refactor(\([^)]+\))?:/i'
  - label: "code-quality"
    title:
      - '/^test(\([^)]+\))?:/i'
  - label: "CI"
    title:
      - '/^ci(\([^)]+\))?:/i'
  - label: "chore"
    title:
      - '/^chore(\([^)]+\))?:/i'
  - label: "documentation"
    title:
      - '/^docs(\([^)]+\))?:/i'
  - label: "style"
    title:
      - '/^style(\([^)]+\))?:/i'
  - label: "performance"
    title:
      - '/^perf(\([^)]+\))?:/i'
  - label: "revert"
    title:
      - '/^revert(\([^)]+\))?:/i'
  - label: "build"
    title:
      - '/^build(\([^)]+\))?:/i'

template: |
  ## What's Changed
  $CHANGES
